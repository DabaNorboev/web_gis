services:
    nginx:
        image: nginx:1.27-alpine
        ports:
            - "127.0.0.1:80:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            php:
                condition: service_started
            node:
                condition: service_healthy

    php:
        networks: [default, routing]
        build:
            context: ./docker/php
            args:
                UID: ${LOCAL_UID:-1000}
                GID: ${LOCAL_GID:-1000}
        environment:
            SATELLITE_RUNTIME: /var/www/html/data/satellite/runtime/krasnoyarsk-2024-2026-a10-1-v1
            SATELLITE_RUNTIME_SHA256: 14c4c26cd9c057cd9e17cdc9182b9f2ae15a5a5881d4bd0e951b6760d750cd6b
            SATELLITE_DELIVERY: /var/www/html/data/satellite/delivery/krasnoyarsk-2024-2026-a10-2-v3
            SATELLITE_DELIVERY_SHA256: 922260c3b4771023a9ae6d78cd54b9ab0b402f0a60548f3b8401cd904a105b1d
        volumes:
            - .:/var/www/html
            - ./data/satellite/runtime/krasnoyarsk-2024-2026-a10-1-v1:/var/www/html/data/satellite/runtime/krasnoyarsk-2024-2026-a10-1-v1:ro
            - ./data/satellite/delivery/krasnoyarsk-2024-2026-a10-2-v3:/var/www/html/data/satellite/delivery/krasnoyarsk-2024-2026-a10-2-v3:ro
        depends_on:
            db:
                condition: service_healthy

    node:
        command: ["npm", "run", "dev", "--", "--strictPort"]
        init: true
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 3s
            timeout: 3s
            retries: 20
            start_period: 10s
        build:
            context: ./docker/node
            args:
                UID: ${LOCAL_UID:-1000}
                GID: ${LOCAL_GID:-1000}
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "127.0.0.1:5173:5173"

    db:
        image: postgis/postgis:16-3.4
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:54325:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10

    local-router:
        profiles: ["routing"]
        image: ghcr.io/project-osrm/osrm-backend@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124
        entrypoint: ["/bin/sh", "/startup.sh"]
        volumes:
            - ./data/prepared/local-routing/osrm-car-20261021-v1:/data:ro
            - ./docker/routing/start.sh:/startup.sh:ro
        user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
        read_only: true
        init: true
        cpus: 2
        mem_limit: 1g
        memswap_limit: 1g
        tmpfs: ["/tmp:size=16m,mode=1777"]
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        networks: [routing]
        healthcheck:
            test: ["CMD-SHELL", "grep -q '00000000:1388 .* 0A ' /proc/net/tcp"]
            interval: 5s
            timeout: 2s
            retries: 3

    local-walking:
        profiles: ["walking"]
        image: heigit/openrouteservice@sha256:e63d4df17a8df5fa1c0432c27b0c361be33e6f21a7b28496e97b6434b5954ce1
        entrypoint: ["/bin/sh", "/startup.sh"]
        volumes:
            - ./data/prepared/local-routing/ors-foot-20261026-v1:/data:ro
            - ./docker/walking/start.sh:/startup.sh:ro
            - ./docker/walking/log4j2.xml:/logging.xml:ro
        user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
        read_only: true
        init: true
        cpus: 2
        mem_limit: 3g
        memswap_limit: 3g
        tmpfs: ["/tmp:size=128m,mode=1777"]
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        logging:
            driver: none
        networks: [routing]
        healthcheck:
            test: ["CMD-SHELL", "wget -q -T 2 -O - http://127.0.0.1:8082/ors/v2/health | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"ready\"'"]
            interval: 10s
            timeout: 2s
            retries: 12
            start_period: 30s

volumes:
    postgres_data:
    node_modules:

networks:
    routing:
        internal: true
