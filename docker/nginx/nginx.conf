# Deliberately log only fixed route classes, never request URI/query, headers or body.
map $uri $placelens_route {
    default other;
    /trips trips;
    /api/v1/trips/analyze trip_analysis;
    /api/v1/addresses/resolve-point point_address;
    /api/v1/place-analysis place_analysis;
    /up health;
}
log_format placelens_safe '$remote_addr [$time_local] "$request_method $placelens_route $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    access_log /var/log/nginx/access.log placelens_safe;
    # Nginx error messages cannot be reformatted and may contain request/query/body.
    # Startup/configuration diagnostics remain in the global error log.
    error_log /dev/null;
    add_header Referrer-Policy "no-referrer" always;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Prepared same-origin satellite PNG: preserve application cache/type headers.
    location ^~ /api/v1/satellite/ {
        add_header Referrer-Policy "no-referrer" always;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 15s;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "zend.exception_ignore_args=1";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Referrer-Policy;
    }

    location = /api/v1/place-analysis {
        client_max_body_size 8k;
        client_body_buffer_size 16k;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        error_page 413 = @place_analysis_too_large;
        error_page 502 = @place_analysis_bad_gateway;
        error_page 504 = @place_analysis_timeout;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 15s;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "zend.exception_ignore_args=1";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Referrer-Policy;
    }

    location @place_analysis_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 413 '{"code":"REQUEST_TOO_LARGE","message":"Request rejected."}';
    }

    location @place_analysis_bad_gateway {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 502 '{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable."}';
    }

    location @place_analysis_timeout {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 504 '{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable."}';
    }

    # Accepted trip bodies stay in memory; do not spool personal input to temp files.
    location = /api/v1/trips/analyze {
        client_max_body_size 8k;
        client_body_buffer_size 16k;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "zend.exception_ignore_args=1";
        fastcgi_hide_header X-Powered-By;
    }

    # Point labels contain personal coordinates; accepted JSON stays in memory.
    location = /api/v1/addresses/resolve-point {
        client_max_body_size 1k;
        client_body_buffer_size 4k;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "zend.exception_ignore_args=1";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Referrer-Policy;
    }

    location ~ /\. {
        deny all;
    }

    location = /index.php {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "zend.exception_ignore_args=1";
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
