name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  documentation-and-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation
        run: python3 -B scripts/check-docs

      - name: Test documentation checker regressions
        run: python3 -B -m unittest discover -s tests/docs -v

      - name: Test portable Compose configuration without local data
        run: python3 -B -m unittest discover -s tests/environment -v

  nginx-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Nginx privacy in a disposable networkless container
        run: python3 -B tests/security/test_trip_nginx.py -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: web_gis_test
          POSTGRES_USER: web_gis
          POSTGRES_PASSWORD: ci_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_gis -d web_gis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: web_gis
      DB_PASSWORD: ci_local_password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, intl, zip, pdo, pdo_pgsql, sqlite, pdo_sqlite
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run unit and feature tests
        run: composer test

      - name: Run full PostGIS suite (guarded migrations, write fixtures and read-only queries)
        run: composer test:postgis

  frontend:
    runs-on: ubuntu-24.04
    container:
      # Match @playwright/test in package-lock.json; browsers and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run typecheck

      - name: Test frontend behavior
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke test comparison in Chromium (local fixtures, no database)
        run: npm run test:smoke

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compare-smoke-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  osm-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned OSM and satellite fixture image
        run: docker build -t web-gis-osm-etl:ci docker/etl

      - name: Test all OSM and satellite preparation fixtures without network or data
        run: >-
          docker run --rm --network=none --memory=1g --cpus=2
          --user "$(id -u):$(id -g)" -v "$PWD:/work:ro"
          web-gis-osm-etl:ci python -m unittest discover -s tests/etl -v
