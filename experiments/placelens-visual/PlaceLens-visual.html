document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
  if(action==='close-dialog'){closeDialog();return;}
  if(action==='demo'){if(dialog.open)closeDialog();demo('three');return;}

  if(action==='change-goals'){changeGoals();return;}

  if(action==='edit-address'){openSearch('address',el.dataset.side);return;}
  if(action==='remove-address'){const side=el.dataset.side;state.profileEpoch[side]++;markSideNeed(side,'Адрес удалён');state[side]=null;state.profiles[side]='empty';state.active=state[side==='a'?'b':'a']?(side==='a'?'b':'a'):'a';render();return;}
  if(action==='choose-search'){if(el.dataset.kind==='address'){chooseAddress(houses.find(h=>h.id===el.dataset.id),el.dataset.side);return;}if(el.dataset.kind==='start'){state.start={...houses.find(h=>h.id===el.dataset.id)};state.standaloneTrips={};closeDialog();render();return;}chooseGoal(destinations.find(g=>g.id===el.dataset.id),el.dataset.replace);return;}
  if(action==='add-goal'){if(selectedGoals().length<3)openSearch('goal');return;}
  if(action==='edit-goal'){editGoal(el.dataset.goal);return;}

  if(action==='remove-goal'){const id=el.dataset.goal,goals=selectedGoals();goals.splice(goals.findIndex(g=>g.id===id),1);Object.keys(selectedTrips()).filter(k=>k.endsWith(':'+id)).forEach(k=>delete selectedTrips()[k]);if(state.focusGoal===id)state.focusGoal=null;render();return;}
  if(action==='mode'){changeMode(el.dataset.value);return;}
  if(action==='radius'){changeRadius(Number(el.dataset.value));return;}
  if(action==='calculate'){calculate();return;}
  if(action==='retry-trip'){state.hasRun[state.scenario]=true;state.phoneScreen='comparison';calculateOne(el.dataset.key);return;}
  if(action==='retry-profile'){loadProfile(el.dataset.side,state.profileCause[el.dataset.side]||'address');return;}
  if(action==='thresholds'){thresholds(el.dataset.goal);return;}
  if(action==='tab'){state.tab=el.dataset.value;render();$(`[data-action="tab"][data-value="${state.tab}"]`)?.focus({preventScroll:true});return;}
  if(action==='goal-map'||action==='street-map'){beginPick(action==='goal-map'?'goal':'street',{replace:el.dataset.replace,key:el.dataset.key,end:el.dataset.end});return;}
  if(action==='pick-point'||action==='pick-start'){beginPick(action==='pick-point'?'point':'start');return;}
  if(action==='search-start'){openSearch('start');return;}
  if(action==='confirm-point'){confirmPoint();return;}
  if(action==='cancel-pick'){state.pick=null;state.phoneScreen='settings';render();return;}
  if(action==='point-calculate'){pointCalculate();return;}
  if(action==='open-goal-map'){openMap(el.dataset.goal,el.dataset.key);return;}

  if(action==='close-map-goal'){closeGoalInspector();return;}

  if(action==='expand-map'){state.mapExpanded=!state.mapExpanded;renderMap();return;}

  if(action==='trip-detail'){tripDetails(el.dataset.key);return;}
  if(action==='detail-map'){const origin=dialogReturn;closeDialog();findFocus(origin)?.focus({preventScroll:true});openMap(el.dataset.goal,el.dataset.key);return;}
  if(action==='retry-trip-dialog'){const key=el.dataset.key;closeDialog();state.phoneScreen='comparison';calculateOne(key);return;}

  if(action==='choose-street'){state.refined[el.dataset.key+':'+el.dataset.end]=true;closeDialog();calculateOne(el.dataset.key);return;}

});
document.addEventListener('input',e=>{const input=e.target;if(!input.dataset.orientation)return;const id=input.dataset.orientation,min=id==='stops'?100:5,max=id==='stops'?1000:60,step=id==='stops'?50:1,value=Number(input.value),valid=input.value!==''&&value>=min&&value<=max&&(value-min)%step===0;$('#orientation-error').hidden=valid;if(!valid){$('#orientation-error').textContent=`Введите от ${min} до ${max}, шаг ${step}.`;return;}document.querySelectorAll('[data-orientation]').forEach(other=>{if(other!==input)other.value=input.value;});updateOrientation(id,value);});
document.addEventListener('change',e=>{if(e.target.dataset.layer)$('#'+e.target.dataset.layer).style.visibility=e.target.checked?'visible':'hidden';});
document.addEventListener('keydown',e=>{
  if(e.target.matches('[role="tab"][data-action="tab"]')){
    if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();$('#result-panel')?.focus({preventScroll:true});return;}

    const next=e.key==='ArrowRight'?(index+1)%tabs.length:e.key==='ArrowLeft'?(index-1+tabs.length)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;
    if(next!==null){e.preventDefault();state.tab=tabs[next].dataset.value;render();$(`[data-action="tab"][data-value="${state.tab}"]`)?.focus({preventScroll:true});return;}
  }
  if(e.key==='Escape'&&!dialog.open){if(state.pick){state.pick=null;state.phoneScreen='settings';render();}else if(!$('#layer-menu').hidden){$('#layer-menu').hidden=true;$('[data-action="layers"]')?.focus();}else if(state.focusGoal){closeGoalInspector();}}if(e.key==='ArrowDown'&&e.target.classList.contains('search-result')){e.preventDefault();e.target.nextElementSibling?.focus();}if(e.key==='ArrowUp'&&e.target.classList.contains('search-result')){e.preventDefault();(e.target.previousElementSibling||$('#search')).focus();}});

<script>

  return `<svg class="ui-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.target}</svg>`;
}
/* Presentation and keyboard destinations for the standalone UX iteration. */
const badge=side=>`<span class="badge ${side==='b'?'b':side==='s'?'start':''}">${side==='s'?'С':sideLabel(side)}</span>`;
const shortAddress=h=>h?.id?h.address.replace('проспект ','').replace('ул. ',''):h?.address||'Адрес не выбран';
const pluralGoals=n=>`${n} ${n===1?'цель':n>1&&n<5?'цели':'целей'}`;
const conditions=()=>`${pluralGoals(selectedGoals().length)} · ${state.mode==='walking'?'пешком':'авто'}${state.scenario==='places'?' · '+state.radius+' м':''}`;
const hypothesis=()=>'<span class="hypothesis">Личные ориентиры · гипотеза</span>';
function legend(){return '<span class="status-key"><span class="within">✓ в ориентире</span><span class="over">↑ дальше</span><span class="unknown-key">? неизвестно</span></span>';}
function needsCalculation(){return selectedSides().some(s=>selectedGoals().some(g=>!selectedTrips()[`${s}:${g.id}`]||selectedTrips()[`${s}:${g.id}`].status==='need'));}
function renderSetup(){
  const goals=selectedGoals(),sides=selectedSides(),busy=Object.values(selectedTrips()).some(t=>t.status==='loading');
  const nav=`<nav class="scenario-nav" aria-label="Сценарий">${[['places','Адреса'],['standalone','Поездки'],['point','Остановки']].map(([value,label])=>`<button data-action="scenario" data-value="${value}" aria-pressed="${state.scenario===value}">${label}</button>`).join('')}</nav>`;
  const candidates=state.scenario==='places'?`<h3 class="field-heading">Ваши адреса <small>до двух</small></h3>${['a','b'].map(side=>state[side]?`<div class="candidate">${badge(side)}<button class="candidate-main" data-action="edit-address" data-side="${side}" aria-label="Заменить адрес ${sideLabel(side)}"><strong>${escapeHTML(state[side].address)}</strong><small>${state.profiles[side]==='loading'?'Обновляем окружение…':state[side].area}</small></button><button class="remove" data-action="remove-address" data-side="${side}" aria-label="Убрать адрес ${sideLabel(side)}">×</button></div>`:`<button class="candidate-empty" data-action="edit-address" data-side="${side}">${badge(side)} Добавить адрес ${sideLabel(side)}</button>`).join('')}${sides.length?'<button class="text-button profile-link" data-action="view-profile">Посмотреть окружение →</button>':''}`:state.scenario==='standalone'?`<h3 class="field-heading">Произвольный старт</h3>${state.start?`<div class="candidate">${badge('s')}<button class="candidate-main" data-action="pick-start"><strong>${escapeHTML(state.start.address)}</strong><small>${state.start.id?'Демо-объект':'Без адресного ID'}</small></button></div>`:'<button class="candidate-empty" data-action="pick-start">⌖ Выбрать старт на карте</button>'}<button class="text-button" data-action="search-start">Выбрать адресный объект</button>`:`<h3 class="field-heading">Любая точка на карте</h3><p class="helper">Официальные остановки вокруг точки. Адресный профиль точке не назначается.</p><button class="candidate-empty" data-action="pick-point">⌖ ${state.point?'Изменить точку':'Выбрать точку'}</button>`;

  const stop=state.scenario==='places'?`<div class="stop-setting">${hypothesis()}<button data-action="thresholds" data-goal="stops">${icon('bus',20)} До остановки <strong>${state.stopLimit} м</strong><span>✎</span></button><small>По прямой, без проверки подхода</small></div>`:'';
  const run=state.scenario==='point'?`<div class="run-controls"><span class="run-summary">Точка без адреса · ${state.radius} м</span><button class="primary full" data-action="point-calculate" ${!state.point||state.pointReady==='loading'?'disabled':''}>${state.pointReady==='loading'?'Ищем…':'Показать остановки'}</button></div>`:`<div class="run-controls"><span class="run-summary">${conditions()}</span><button class="primary full ${needsCalculation()?'needs-run':''}" data-action="calculate" ${!sides.length||!goals.length||busy?'disabled':''}>${busy?'<span class="loader"></span> Считаем…':state.scenario==='standalone'?'Рассчитать поездки →':'Рассчитать и сравнить →'}</button><p>${state.mode==='walking'?'Модель уличной части. Подходы неизвестны.':'Автомодель без пробок и парковки.'}</p></div>`;
  $('#setup').innerHTML=`<div class="setup-head"><h2>Настройки</h2>${nav}</div><div class="setup-fields">${candidates}${state.scenario==='standalone'?'':radius}${tripFields}${stop}</div>${run}`;
}
function renderWorking(){

function renderScreen(){

function thresholdBar(value,limit,scale,tone,label){

  const max=Math.max(scale,limit*1.2,value*1.02),width=value/max*100,mark=limit/max*100,neutral=tone==='neutral';
  return `<div class="visual-bar ${tone}" role="img" aria-label="${escapeHTML(label)}: ${value}; ${neutral?'радиус анализа':'личный ориентир'} ${limit}"><i style="width:${width}%"></i>${value>limit?`<i class="bar-overflow ${neutral?'outside-radius':''}" style="left:${mark}%;width:${width-mark}%"></i>`:''}<b style="left:${mark}%"></b></div>`;
}
function statusText(entry,g){if(!entry||entry.status==='need')return 'Нужен расчёт';if(entry.status==='loading')return 'Считаем';if(entry.status==='error')return 'Сбой расчёта';if(entry.status==='refine')return 'Нужна улица';return entry.minutes<=goalLimit(g)?'✓ в ориентире':`↑ ${entry.minutes-goalLimit(g)} мин сверх`;}
function columnHeads(sides){return sides.map(side=>`<th scope="col"><div class="column-header">${badge(side)}<span aria-label="Адрес ${sideLabel(side)}: ${escapeHTML(getHouse(side)?.address)}">${escapeHTML(shortAddress(getHouse(side)))}</span><button data-action="${side==='s'?'pick-start':'edit-address'}" data-side="${side}" aria-label="Заменить ${side==='s'?'старт':'адрес '+sideLabel(side)}">Заменить</button></div></th>`).join('');}
function tripCell(g,side){

  if(!ready(entry)){
    const pending=entry?.status==='loading',refinement=entry?.status==='refine';

function environmentRows(){return metrics.map(m=>{const detailLabel=`${m.name}. ${envNote[m.id].short}. ${envNote[m.id].long}`;return `<tr class="environment-row ${m.id==='stops'&&[...state.changedCells].some(k=>k.startsWith('stop:'))?'changed-row':''}" data-env-row="${m.id}"><th scope="row"><button class="metric-name" data-action="metric-detail" data-metric="${m.id}" title="${escapeHTML(detailLabel)}" aria-label="${escapeHTML(detailLabel)}" aria-expanded="${state.envFocus===m.id}">${icon(metricLabels[m.id][0],18)}<span>${metricLabels[m.id][1]}</span></button>${m.id==='stops'?`<button class="inline-limit" data-action="thresholds" data-goal="stops">До ${state.stopLimit} м ✎</button>`:`<small class="metric-caption">${metricLabels[m.id][2]}</small>`}</th>${selectedSides().map(side=>metricCell(m,side)).join('')}</tr>${state.envFocus===m.id?`<tr class="metric-detail"><td colspan="${selectedSides().length+1}"><strong>${m.name}</strong><p>${envNote[m.id].long}</p><p>${m.source}. Дата наблюдения неизвестна. Снимок demo-2026-10.</p><button class="text-button" data-action="sources">Источники и покрытие →</button></td></tr>`:''}`}).join('');}

function pointView(){if(!state.point)return '<div class="empty-state"><h2>Остановки рядом с любой точкой</h2><p>Точка останется точкой, без выдуманного адресного объекта.</p><button class="primary" data-action="pick-point">Выбрать точку</button></div>';if(state.pointReady==='loading')return '<div class="empty-state"><span class="loader"></span> Ищем демонстрационные остановки…</div>';if(!state.pointReady)return '<div class="empty-state"><h2>Точка выбрана</h2><button class="primary" data-action="point-calculate">Показать остановки</button></div>';return `<section class="point-results"><h2>Остановки в ${state.radius} м</h2><p>Городские остановки · по прямой · демо</p>${[{n:'Театральная площадь',d:120},{n:'Улица Сурикова',d:240},{n:'Дом техники',d:360},{n:'Улица Ленина',d:470}].filter(s=>s.d<=state.radius).map(s=>`<div class="stop-row"><strong>${s.n}</strong><span>${s.d} м</span></div>`).join('')}<p class="helper">Подходы не проверены. Дата наблюдения неизвестна.</p><button class="quiet" data-action="sources">О данных</button></section>`;}
